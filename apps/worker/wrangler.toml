name = "abelprocure-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
EBAY_ENV = "production"
EBAY_MARKETPLACE_ID = "EBAY_GB"
FRONTEND_ORIGIN = "https://mrlucien-johnson.github.io"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://mrlucien-johnson.github.io"

[[d1_databases]]
binding = "DB"
database_name = "abelprocure"
database_id = "REPLACE_WITH_CLOUDFLARE_DATABASE_ID"

[triggers]
crons = ["* * * * *"]
